    <rect x="40" y="53" width="40" height="5" rx="2.5" fill="url(#glass)"/>
    <path d="M42 30 L82 30" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="82" cy="37" r="2.2" fill="#4dd8ff"/>
    <rect x="44" y="37" width="24" height="4" rx="2" fill="#ffffff" fill-opacity=".14"/>
