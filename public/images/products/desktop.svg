  <path d="M40 58 L60 55 L66 84 L22 86 Z" fill="url(#beam)"/>
  <rect x="22" y="80" width="30" height="11" rx="1.5" fill="#ffffff"/>
  <g fill="#123a66"><rect x="25" y="82" width="1.5" height="7"/><rect x="28" y="82" width="3" height="7"/><rect x="32.5" y="82" width="1" height="7"/><rect x="35" y="82" width="2.5" height="7"/><rect x="39" y="82" width="1" height="7"/><rect x="41.5" y="82" width="3" height="7"/><rect x="46" y="82" width="1.5" height="7"/></g>
  <line x1="20" y1="85.5" x2="54" y2="85.5" stroke="#4dd8ff" stroke-width="1.2"/>
  <!-- stand -->
  <path d="M74 58 L84 93 L96 93 L86 56 Z" fill="#0a1426"/>
  <!-- head (tilted) -->
