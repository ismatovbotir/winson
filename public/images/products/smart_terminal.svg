<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4a6e"/><stop offset="1" stop-color="#0c1b2f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd8ff"/><stop offset="1" stop-color="#0b8fc4"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#123a66" stop-opacity=".22"/><stop offset="1" stop-color="#123a66" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="118" height="118" rx="16" fill="#e8eff8"/>
  <ellipse cx="60" cy="108" rx="34" ry="5" fill="url(#shadow)"/>
  <!-- base + pole -->
  <rect x="34" y="100" width="52" height="7" rx="3.5" fill="#0a1426"/>
  <rect x="55" y="76" width="10" height="26" fill="#1b2f4a"/>
  <rect x="55" y="76" width="3" height="26" fill="#ffffff" fill-opacity=".12"/>
  <!-- terminal body -->
  <rect x="24" y="12" width="72" height="68" rx="8" fill="url(#body)"/>
  <path d="M30 15.5 L90 15.5" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <!-- touch screen: product + price -->
  <rect x="30" y="20" width="60" height="40" rx="3" fill="#061d33"/>
  <rect x="35" y="25" width="18" height="18" rx="2" fill="#17b8ec" fill-opacity=".25"/>
  <path d="M39 38 L43 32 L46 36 L48 34 L50 38 Z" fill="#4dd8ff"/>
  <g fill="#ffffff" fill-opacity=".75"><rect x="57" y="26" width="26" height="3" rx="1.5"/><rect x="57" y="32" width="18" height="3" rx="1.5"/></g>
  <rect x="57" y="39" width="26" height="6" rx="2" fill="#4dd8ff"/>
  <g fill="#ffffff" fill-opacity=".4"><rect x="35" y="48" width="48" height="2.5" rx="1"/><rect x="35" y="53" width="34" height="2.5" rx="1"/></g>
  <!-- scan window + indicator -->
  <rect x="44" y="65" width="32" height="6" rx="3" fill="url(#glass)"/>
  <circle cx="84" cy="68" r="2" fill="#4dd8ff"/>
  <!-- receipt/printer slot -->
  <rect x="44" y="74" width="32" height="2" rx="1" fill="#0a1426"/>
</svg>
