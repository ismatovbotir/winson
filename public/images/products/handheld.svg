<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4a6e"/><stop offset="1" stop-color="#0c1b2f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd8ff"/><stop offset="1" stop-color="#0b8fc4"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#123a66" stop-opacity=".22"/><stop offset="1" stop-color="#123a66" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="118" height="118" rx="16" fill="#e8eff8"/>
  <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#17b8ec" stop-opacity=".55"/><stop offset="1" stop-color="#17b8ec" stop-opacity="0"/></linearGradient>
  <ellipse cx="66" cy="104" rx="30" ry="5" fill="url(#shadow)"/>
