  <rect x="36" y="40" width="48" height="24" rx="4" fill="#0a1426"/>
  <circle cx="60" cy="52" r="9" fill="#1b2f4a"/>
  <circle cx="60" cy="52" r="6.5" fill="url(#lens)"/>
  <circle cx="57.5" cy="49.5" r="1.6" fill="#ffffff" fill-opacity=".8"/>
  <g fill="#4dd8ff"><circle cx="43" cy="52" r="2.4"/><circle cx="77" cy="52" r="2.4"/></g>
  <g fill="#ffffff" fill-opacity=".55"><rect x="41" y="44" width="4" height="2" rx="1"/><rect x="75" y="44" width="4" height="2" rx="1"/><rect x="41" y="58" width="4" height="2" rx="1"/><rect x="75" y="58" width="4" height="2" rx="1"/></g>
  <!-- mounting holes -->
  <g fill="#e8eff8"><circle cx="32" cy="34" r="1.6"/><circle cx="88" cy="34" r="1.6"/></g>
