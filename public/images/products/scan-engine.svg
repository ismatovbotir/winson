<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4a6e"/><stop offset="1" stop-color="#0c1b2f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd8ff"/><stop offset="1" stop-color="#0b8fc4"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#123a66" stop-opacity=".22"/><stop offset="1" stop-color="#123a66" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="118" height="118" rx="16" fill="#e8eff8"/>
  <radialGradient id="lens" cx=".4" cy=".35"><stop offset="0" stop-color="#b9f0ff"/><stop offset=".45" stop-color="#17b8ec"/><stop offset="1" stop-color="#062a45"/></radialGradient>
  <ellipse cx="60" cy="96" rx="38" ry="5" fill="url(#shadow)"/>
  <!-- flex cable -->
  <path d="M70 80 L70 92 Q70 98 76 98 L104 98" fill="none" stroke="#d98c2b" stroke-width="7"/>
  <g stroke="#f7d9a8" stroke-width=".8"><line x1="100" y1="95" x2="100" y2="101"/><line x1="103" y1="95" x2="103" y2="101"/></g>
  <!-- PCB -->
  <rect x="24" y="70" width="72" height="12" rx="2" fill="#1f7a5a"/>
  <g fill="#e8c46a"><rect x="30" y="74" width="4" height="3"/><rect x="38" y="74" width="4" height="3"/><rect x="78" y="74" width="4" height="3"/><rect x="86" y="74" width="4" height="3"/></g>
  <rect x="48" y="73" width="14" height="6" rx="1" fill="#0a1426"/>
