<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4a6e"/><stop offset="1" stop-color="#0c1b2f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd8ff"/><stop offset="1" stop-color="#0b8fc4"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#123a66" stop-opacity=".22"/><stop offset="1" stop-color="#123a66" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="118" height="118" rx="16" fill="#e8eff8"/>
  <linearGradient id="glassd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f4a73"/><stop offset="1" stop-color="#061d33"/></linearGradient>
  <!-- mounting panel -->
  <rect x="14" y="14" width="92" height="92" rx="10" fill="#c9d6e6"/>
  <rect x="14" y="14" width="92" height="92" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".6"/>
  <!-- bezel -->
  <rect x="26" y="24" width="68" height="72" rx="10" fill="url(#body)"/>
  <path d="M32 27.5 L88 27.5" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <!-- reading glass with QR being read -->
  <rect x="34" y="32" width="52" height="44" rx="5" fill="url(#glassd)"/>
  <g fill="#4dd8ff" fill-opacity=".9">
    <rect x="47" y="41" width="9" height="9" rx="1"/><rect x="64" y="41" width="9" height="9" rx="1"/><rect x="47" y="58" width="9" height="9" rx="1"/>
    <rect x="59" y="53" width="3" height="3"/><rect x="64" y="58" width="3" height="3"/><rect x="69" y="63" width="4" height="4"/><rect x="59" y="62" width="3" height="5"/><rect x="69" y="54" width="4" height="3"/>
  </g>
  <g fill="#061d33"><rect x="49.5" y="43.5" width="4" height="4"/><rect x="66.5" y="43.5" width="4" height="4"/><rect x="49.5" y="60.5" width="4" height="4"/></g>
  <!-- scan frame corners -->
  <path d="M40 38 v-2 h5 M80 38 v-2 h-5 M40 70 v2 h5 M80 70 v2 h-5" fill="none" stroke="#4dd8ff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- glass reflection -->
  <path d="M36 70 L58 34 L66 34 L44 70 Z" fill="#ffffff" fill-opacity=".07"/>
  <!-- status LEDs -->
  <rect x="48" y="84" width="10" height="3" rx="1.5" fill="#4dd8ff"/>
  <rect x="62" y="84" width="10" height="3" rx="1.5" fill="#ffffff" fill-opacity=".25"/>
  <!-- screws -->
  <g fill="#8aa3c2"><circle cx="20" cy="20" r="2"/><circle cx="100" cy="20" r="2"/><circle cx="20" cy="100" r="2"/><circle cx="100" cy="100" r="2"/></g>
</svg>
